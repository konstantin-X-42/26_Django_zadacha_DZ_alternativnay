{% extends 'dogs/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-1">
    <div class="container">
        <div class="row row-cols-1 sm:row-cols-2 md:row-cols-3 g-3">
            {% for dog in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ dog.photo | media_filter }}">
                    <div class="card-body">
                        <p class="card-text">{{ dog.name }}</p>
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div class="btn-group">
                                <a class="btn-solid theme-primary" href="{% url 'dogs:dogs_detail' dog.pk %}"
                                   role="button">Посмотреть</a>
                                <a class="btn-solid theme-primary" href="{% url 'dogs:dogs_update' dog.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn-solid theme-primary" href="{% url 'dogs:dogs_delete' dog.pk %}"
                                   role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
